<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso · Punto de Venta</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at top left,#e5edff 0%,transparent 48%),linear-gradient(135deg,#f5f7fc,#edf2f9);font-family:Inter,"Segoe UI",system-ui,sans-serif;color:#172033;padding:20px}.card{width:min(430px,100%);background:rgba(255,255,255,.94);padding:38px;border:1px solid #ffffff;border-radius:22px;box-shadow:0 24px 65px #1f29371b;backdrop-filter:blur(12px)}.brand{display:flex;align-items:center;gap:12px;margin-bottom:25px}.brand-mark{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#6385ff,#315ee8);color:#fff;font-size:15px;font-weight:850;box-shadow:0 8px 18px #315ee83b}.brand small{display:block;margin-top:3px;color:#7a879c;font-size:11px;letter-spacing:.09em;text-transform:uppercase}h1{margin:0 0 9px;font-size:28px;letter-spacing:-.045em}p{color:#68758a;margin:0 0 25px;font-size:14px}label{display:block;font-size:12px;color:#59677d;font-weight:750;margin:16px 0 7px}input{width:100%;padding:13px;border:1px solid #dce3ed;border-radius:10px;font-size:14px;background:#fff;transition:border-color .16s,box-shadow .16s}input:focus{outline:none;border-color:#7a98ff;box-shadow:0 0 0 4px #315ee817}button{width:100%;margin-top:23px;padding:14px;border:0;border-radius:11px;background:linear-gradient(100deg,#315ee8,#4776ff);color:white;font-weight:750;font-size:14px;cursor:pointer;box-shadow:0 8px 17px #315ee82d;transition:transform .16s,box-shadow .16s}button:hover{transform:translateY(-1px);box-shadow:0 11px 22px #315ee83b}button:disabled{opacity:.6;cursor:wait}.error{display:none;margin-top:14px;padding:11px;border-radius:9px;background:#fff0f0;color:#a12e3b;font-size:13px}.sub{font-size:11px;line-height:1.5;color:#8290a4;margin-top:22px;text-align:center}@media(max-width:480px){.card{padding:27px;border-radius:18px}}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><div class="brand-mark">PV</div><div><strong>PUNTO DE VENTA</strong><small>Gestión comercial</small></div></div>
    <h1>Bienvenido de nuevo</h1>
    <p>Inicia sesión para continuar con tu jornada.</p>
    <form id="formLogin">
      <label for="usuario">Usuario</label>
      <input id="usuario" name="usuario" autocomplete="username" required autofocus>
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button id="entrar" type="submit">Entrar</button>
      <div id="error" class="error" role="alert"></div>
    </form>
    <div class="sub">Si no tienes usuario, pide al administrador principal que lo cree.</div>
  </main>
  <script>
    const form=document.getElementById('formLogin');
    const boton=document.getElementById('entrar');
    const error=document.getElementById('error');
    form.addEventListener('submit',async evento=>{
      evento.preventDefault();error.style.display='none';boton.disabled=true;boton.textContent='Comprobando…';
      try{
        const respuesta=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({usuario:document.getElementById('usuario').value.trim(),password:document.getElementById('password').value})});
        const datos=await respuesta.json().catch(()=>({}));
        if(!respuesta.ok)throw new Error(datos.error||'No se pudo iniciar sesión');
        sessionStorage.setItem('tokenPestana',datos.tokenPestana);
        window.location.replace('/');
      }catch(e){error.textContent=e.message;error.style.display='block';}
      finally{boton.disabled=false;boton.textContent='Entrar';}
    });
  </script>
</body>
</html>
